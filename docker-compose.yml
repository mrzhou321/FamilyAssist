services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: family_assister
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_assister"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G   # 适配 8GB 机器，为 postgres/backend 留余量

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://family:family_dev_password@postgres:5432/family_assister
      OLLAMA_BASE_URL: http://ollama:11434
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  frontend_dist:
