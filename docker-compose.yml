services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: family_assister
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_assister"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G   # 适配 8GB 机器，为 postgres/backend 留余量

  ollama-models:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      GENERATION_MODEL: qwen2.5:3b
      EMBEDDING_MODEL: qllama/bge-small-zh-v1.5
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull $$GENERATION_MODEL;
      ollama pull $$EMBEDDING_MODEL"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://family:family_dev_password@postgres:5432/family_assister
      OLLAMA_BASE_URL: http://ollama:11434
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: family-admin
      ADMIN_TOKEN_SECRET: family-assister-dev-secret
      DEBUG: "false"
      REQUIRE_DATABASE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
